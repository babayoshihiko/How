  - crosssectional_intro.json
  - meta_intro.json
  - rct_intro.json
  - crosssectional_intro.json
  - screening_intro.json
  - statement.json

book:
  title: "医学英語：臨床論文の読み方"
  author: "馬場 美彦"
  date: today
  chapters:
    - index.qmd
    - design.qmd
    - frailty.qmd
    - part: meta.qmd
      chapters:
        - meta_intro.qmd
        - meta_r.qmd
    - part: ct.qmd
      chapters:
        - rct_intro.qmd
    - part: observation.qmd
      chapters:
        - crosssectional_intro.qmd
        - cohort_intro.qmd
        - screening_intro.qmd
        - screening_r.qmd
